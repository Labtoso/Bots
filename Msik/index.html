<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex">
<meta name="theme-color" content="#0f1115">
<title>Msik</title>
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
</head>
<body data-accent="blue">
<header class="top">
  <button class="icon-btn" id="openSettings" data-i18n-title="settings"></button>
  <div class="brand"><img src="icon.svg" alt="" width="22" height="22"><span>Msik</span></div>
  <div class="top-right">
    <div class="server" id="server" hidden>
      <img id="serverIcon" alt="" width="28" height="28">
      <span id="serverName"></span>
    </div>
    <span class="dot" id="connDot"></span>
    <img class="avatar" id="userAvatar" alt="" width="30" height="30" hidden>
  </div>
</header>

<main id="app" hidden>
  <section class="panel player">
    <div class="cover-wrap">
      <img class="cover" id="cover" alt="" hidden>
      <div class="cover ph" id="coverPh"></div>
    </div>
    <div class="meta">
      <h1 id="title"></h1>
      <p id="artist" class="muted"></p>
      <p id="requester" class="muted small"></p>
    </div>
    <div class="progress">
      <input type="range" id="seek" min="0" max="100" value="0" step="0.1" aria-label="seek">
      <div class="times"><span id="pos">0:00</span><span id="dur">0:00</span></div>
    </div>
    <div class="controls">
      <button class="icon-btn" id="btnShuffle" data-i18n-title="shuffle"></button>
      <button class="icon-btn lg" id="btnPrev" data-i18n-title="previous"></button>
      <button class="play" id="btnPlay" data-i18n-title="playPause"></button>
      <button class="icon-btn lg" id="btnNext" data-i18n-title="next"></button>
      <button class="icon-btn" id="btnLoop" data-i18n-title="loop"></button>
    </div>
    <div class="row volume">
      <button class="icon-btn" id="btnMute" data-i18n-title="mute"></button>
      <input type="range" id="volume" min="0" max="150" value="60" aria-label="volume">
      <span id="volVal" class="muted small num">60</span>
    </div>
    <div class="row opts">
      <label class="select" data-i18n-title="filterTip">
        <span data-i18n="filter"></span>
        <select id="filter">
          <option value="none"></option><option value="bassboost">Bassboost</option>
          <option value="nightcore">Nightcore</option><option value="vaporwave">Vaporwave</option>
          <option value="8d">8D</option><option value="karaoke">Karaoke</option>
        </select>
      </label>
      <label class="switch" data-i18n-title="autoplayTip">
        <input type="checkbox" id="autoplay"><span class="track"></span><span data-i18n="autoplay"></span>
      </label>
    </div>
    <div class="row channel">
      <span class="dot" id="voiceDot"></span>
      <span id="voiceName" class="muted"></span>
      <button class="btn ghost sm" id="btnStop" data-i18n="stop"></button>
      <button class="btn ghost sm" id="btnLeave" data-i18n="leave"></button>
    </div>
  </section>

  <section class="panel side">
    <form class="search" id="searchForm" autocomplete="off">
      <span class="search-icon" id="searchIcon"></span>
      <input id="searchInput" type="search" data-i18n-ph="searchPh" enterkeyhint="search">
    </form>
    <div class="results" id="results" hidden>
      <div class="results-head">
        <span id="resultsTitle" class="muted small"></span>
        <button class="btn sm" id="addAll" hidden></button>
        <button class="icon-btn sm" id="closeResults" data-i18n-title="close"></button>
      </div>
      <ul class="list" id="resultList"></ul>
    </div>
    <div class="tabs">
      <button class="tab active" data-tab="queue"><span data-i18n="queue"></span> <span class="count" id="qCount">0</span></button>
      <button class="tab" data-tab="history" data-i18n="history"></button>
      <div class="tab-tools">
        <span class="muted small num" id="qTotal"></span>
        <button class="btn ghost sm" id="btnClear" data-i18n="clear"></button>
      </div>
    </div>
    <ul class="list queue" id="queueList"></ul>
    <ul class="list" id="historyList" hidden></ul>
    <div class="empty muted" id="queueEmpty" data-i18n="queueEmpty"></div>
  </section>
</main>

<section class="gate" id="gate" hidden>
  <img src="icon.svg" alt="" width="56" height="56">
  <h2 id="gateTitle"></h2>
  <p class="muted" id="gateText"></p>
  <button class="btn" id="gateRetry" hidden></button>
</section>

<div class="drawer-bg" id="drawerBg" hidden></div>
<aside class="drawer" id="drawer" aria-hidden="true">
  <div class="drawer-head">
    <h2 data-i18n="settings"></h2>
    <button class="icon-btn" id="closeSettings" data-i18n-title="close"></button>
  </div>
  <div class="field">
    <span class="label" data-i18n="language"></span>
    <div class="seg" id="langSeg">
      <button data-lang="de">Deutsch</button><button data-lang="en">English</button>
    </div>
  </div>
  <div class="field">
    <span class="label" data-i18n="accent"></span>
    <div class="swatches" id="swatches">
      <button data-accent="blue" class="sw" style="--c:#3b82f6"></button>
      <button data-accent="green" class="sw" style="--c:#22c55e"></button>
      <button data-accent="purple" class="sw" style="--c:#8b5cf6"></button>
    </div>
  </div>
  <div class="field">
    <span class="label" data-i18n="session"></span>
    <p class="muted small" id="sessionInfo"></p>
    <button class="btn ghost sm" id="logout" data-i18n="logout"></button>
  </div>
  <footer class="drawer-foot muted small">© LabtosoStudios</footer>
</aside>

<div class="toast" id="toast" hidden></div>
<script src="app.js" type="module"></script>
</body>
</html>
